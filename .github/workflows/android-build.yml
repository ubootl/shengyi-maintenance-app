name: Build APK

on:
  push:
    branches:
      - main  # 监听main分支
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout代码
    - name: Checkout code
      uses: actions/checkout@v3  # 更新为v3

    # 2. 设置JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'  # 使用JDK 17
        distribution: 'temurin'  # 使用temurin JDK分发版

    # 3. 缓存Gradle依赖（提高构建速度）
    - name: Cache Gradle dependencies
      uses: actions/cache@v3  # 使用v3
      with:
        path: ~/.gradle
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # 4. 运行Gradle构建命令，生成APK
    - name: Build APK
      run: ./gradlew assembleDebug  # 使用assembleDebug命令

    # 5. 上传生成的APK文件
    - name: Upload APK
      uses: actions/upload-artifact@v4  # 使用v4
      with:
        name: apk
        path: app/build/outputs/apk/debug/app-debug.apk
