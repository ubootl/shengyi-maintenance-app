name: Build APK

on:
  push:
    branches:
      - main  # 监听 main 分支
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'

    - name: Cache Gradle dependencies
      uses: actions/cache@v3  # 更新为 v3
      with:
        path: ~/.gradle
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build APK
      run: ./gradlew assembleDebug  # 使用 assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3  # 更新为 v3
      with:
        name: apk
        path: app/build/outputs/apk/debug/app-debug.apk
